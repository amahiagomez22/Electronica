<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio de Electricidad - Índice</title>
    <style>
        :root {
            --rosa: #ffb6c1;
            --rosa-oscuro: #ff69b4;
            --lila: #e0d1ff;
            --lila-oscuro: #6a4c93;
            --blanco: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fdfbff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .contenedor-indice {
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 2px solid var(--lila);
        }

        h1 {
            color: var(--lila-oscuro);
            margin-bottom: 10px;
            font-size: 2rem;
        }

        p {
            color: #777;
            margin-bottom: 30px;
        }

        .menu-opciones {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .opcion-card {
            text-decoration: none;
            padding: 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.1rem;
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .opcion-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* Estilo para el botón Rosa */
        .btn-leyes {
            background-color: var(--rosa);
            color: white;
            border: 2px solid var(--rosa-oscuro);
        }

        /* Estilo para el botón Lila */
        .btn-taller {
            background-color: var(--lila);
            color: var(--lila-oscuro);
            border: 2px solid var(--medium-lila);
        }

        .corazon {
            color: var(--rosa-oscuro);
        }

        footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #bbb;
        }
    </style>
</head>
<body>

    <div class="contenedor-indice">
        <h1>Mi Portafolio <span class="corazon">♥</span></h1>
        <p>Selecciona una sección para explorar los conceptos de electricidad:</p>

        <div class="menu-opciones">
            <a href="leyes_fundamentales.html" class="opcion-card btn-leyes">
                <span>1. Leyes Fundamentales</span>
            </a>

            <a href="taller_investigacion.html" class="opcion-card btn-taller">
                <span>2. Taller de Investigación</span>
            </a>
        </div>

        <footer>
            Amahia Gomez &copy; 2026
        </footer>
    </div>

</body>
</html>
