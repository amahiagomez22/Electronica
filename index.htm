<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portafolio - Electricidad y Electrónica (Corregido)</title>
    <style>
        /* Variables con tus colores exactos */
        :root {
            --rosa-boton: #ffb6c1;
            --morado-boton: #e8dff5;
            --verde-boton: #8bc34a;
            --gris-boton: #eeeeee;
            --texto-morado: #6a1b9a;
            --texto-oscuro: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* FONDO DINÁMICO ESTILO AURORA */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(125deg, #e0f7fa, #e8eaf6, #f3e5f5, #e1f5fe, #e8f5e9);
            background-size: 400% 400%;
            animation: movimientoAurora 15s ease infinite;
            overflow-x: hidden;
        }

        @keyframes movimientoAurora {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .contenedor-global {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            max-width: 1300px;
            width: 100%;
            flex-wrap: wrap;
        }

        .columna-fotos {
            display: flex;
            flex-direction: column;
            gap: 25px;
            flex: 1;
            min-width: 250px;
            align-items: center;
        }

        /* CAJAS CONTENEDORAS PARA LAS IMÁGENES */
        .caja-imagen {
            width: 100%;
            max-width: 280px;
            height: 200px;
            background: rgba(255, 255, 255, 0.4);
            border: 2px dashed rgba(106, 27, 154, 0.3);
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            transition: transform 0.3s ease;
            overflow: hidden; /* Mantiene la imagen dentro de los bordes redondeados */
        }

        /* --- ESTILO CORREGIDO PARA QUE NO SALGAN CORTADAS --- */
        .caja-imagen img {
            width: 100%;
            height: 100%;
            /* 'contain' ajusta la imagen completa para que se vea entera, sin cortes */
            object-fit: contain; 
            border-radius: 12px;
        }

        .caja-imagen:hover {
            transform: scale(1.03);
            background: rgba(255, 255, 255, 0.6);
        }

        /* TARJETA CENTRAL */
        .tarjeta-portafolio {
            background-color: #ffffff;
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 10px 30px rgba(156, 39, 176, 0.05);
            text-align: center;
            border: 1px solid rgba(232, 223, 245, 0.6);
            flex: 1.5;
            min-width: 320px;
        }

        .tarjeta-portafolio h1 {
            color: var(--texto-morado);
            font-size: 2.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .tarjeta-portafolio p {
            color: var(--texto-oscuro);
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .separador {
            border: none;
            height: 1px;
            background: linear-gradient(to right, transparent, #e0e0e0, transparent);
            margin: 25px 0;
        }

        .boton-enlace {
            display: block;
            text-decoration: none;
            padding: 16px 20px;
            margin-bottom: 15px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.02);
        }

        .boton-enlace:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.06);
        }

        .btn-leyes { background-color: var(--rosa-boton); color: #ffffff; }
        .btn-taller { background-color: var(--morado-boton); color: #512da8; }
        .btn-electronica { background-color: var(--verde-boton); color: #ffffff; }
        .btn-principal { background-color: var(--gris-boton); color: #555555; }

        .footer-texto {
            font-size: 0.75rem;
            color: #999999;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="contenedor-global">
        
        <div class="columna-fotos">
            <div class="caja-imagen">
                <img src="https://media.glamour.mx/photos/69a5fef02bf28372a0263682/master/w_1600,c_limit/SP26_JK_PR_nologo_13.jpg" 
                     alt="Foto Jungkook (Contain)">
            </div>
            <div class="caja-imagen">
                <img src="https://fotos.perfil.com//2026/01/09/900/0/kim-taehyung-para-gq-2026-2167226.jpg" 
                     alt="Foto Taehyung (Contain)">
            </div>
        </div>

        <div class="tarjeta-portafolio">
            <h1>Mi Portafolio ♥</h1>
            <p>Explora las secciones de electricidad y electrónica:</p>

            <a href="leyes.html" class="boton-enlace btn-leyes">1. Leyes Fundamentales</a>
            <a href="taller.html" class="boton-enlace btn-taller">2. Taller de Investigación</a>
            <a href="electronica.html" class="boton-enlace btn-electronica">3. Electrónica Básica</a>
            
            <hr class="separador">

            <a href="principal.html" class="boton-enlace btn-principal">Ir a Página Principal (ITCTS4Z)</a>

            <div class="footer-texto">Amahia Gomez © 2026</div>
        </div>

        <div class="columna-fotos">
            <div class="caja-imagen">
                <img src="https://img2.rtve.es/im/6788662/?w=900" alt="Foto RTVE (Contain)">
            </div>
            <div class="caja-imagen">
                <img src="https://via.placeholder.com/280x200/ffb6c1/6a1b9a?text=Espacio+para+Imagen+4" alt="Espacio para Imagen 4">
            </div>
        </div>

    </div>

</body>
</html>
