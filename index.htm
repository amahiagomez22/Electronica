<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Portafolio - Electricidad y Electrónica</title>
    <style>
        /* Variables con tus colores exactos de botones */
        :root {
            --rosa-boton: #ffb6c1;
            --morado-boton: #e8dff5;
            --verde-boton: #8bc34a;
            --gris-boton: #eeeeee;
            --texto-morado: #6a1b9a;
            --texto-oscuro: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* FONDO DINÁMICO AURORA (Tonos muy claros y suaves) */
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(125deg, #e0f7fa, #e8eaf6, #f3e5f5, #e1f5fe, #e8f5e9);
            background-size: 400% 400%;
            animation: movimientoAurora 15s ease infinite;
            overflow-x: hidden;
        }

        @keyframes movimientoAurora {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* CONFIGURACIÓN DEL CONTENEDOR FLUIDO */
        .contenedor-global {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            max-width: 1250px;
            width: 100%;
            flex-wrap: wrap;
        }

        /* COLUMNAS LATERALES */
        .columna-fotos {
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex: 1;
            min-width: 260px;
            align-items: center;
        }

        /* --- NUEVO ESTILO DE IMAGEN LIMPIO (SIN BORDES EXTRAÑOS NI CORTES) --- */
        .caja-imagen {
            width: 100%;
            max-width: 280px;
            display: block;
            border-radius: 16px;
            /* Una sombra muy suave que le da profundidad sobre la aurora */
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06); 
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .caja-imagen img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 16px; /* Ajuste perfecto para las esquinas de tus fotos */
        }

        /* Efecto flotante sutil al pasar el mouse por encima */
        .caja-imagen:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 25px rgba(106, 27, 154, 0.12);
        }

        /* TARJETA CENTRAL ORIGINAL (Fiel a tu diseño inicial) */
        .tarjeta-portafolio {
            background-color: #ffffff;
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 10px 30px rgba(156, 39, 176, 0.04);
            text-align: center;
            border: 1px solid rgba(232, 223, 245, 0.5);
            flex: 1.4;
            min-width: 320px;
        }

        /* Título "Mi Portafolio ♥" idéntico a tu captura */
        .tarjeta-portafolio h1 {
            color: var(--texto-morado);
            font-size: 2.1rem;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .tarjeta-portafolio p {
            color: var(--texto-oscuro);
            font-size: 0.95rem;
            margin-bottom: 28px;
        }

        .separador {
            border: none;
            height: 1px;
            background: linear-gradient(to right, transparent, #e2e2e2, transparent);
            margin: 22px 0;
        }

        /* BOTONES */
        .boton-enlace {
            display: block;
            text-decoration: none;
            padding: 15px 20px;
            margin-bottom: 14px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .boton-enlace:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 10px rgba(0,0,0,0.05);
        }

        .btn-leyes { background-color: var(--rosa-boton); color: #ffffff; }
        .btn-taller { background-color: var(--morado-boton); color: #512da8; }
        .btn-electronica { background-color: var(--verde-boton); color: #ffffff; }
        .btn-principal { background-color: var(--gris-boton); color: #555555; }

        .footer-texto {
            font-size: 0.75rem;
            color: #aaaaaa;
            margin-top: 18px;
        }
    </style>
</head>
<body>

    <div class="contenedor-global">
        
        <div class="columna-fotos">
            <div class="caja-imagen">
                <img src="https://i.pinimg.com/736x/75/ca/d2/75cad293b5d87be4e959487c3bedeb4b.jpg">
            </div>
        </div>

        <div class="tarjeta-portafolio">
            <h1>Mi Portafolio ♥</h1>
            <p>Explora las secciones de electricidad y electrónica:</p>

            <a href="leyes_fundamentales.html" class="boton-enlace btn-leyes">1. Leyes Fundamentales</a>
            <a href="taller_investigacion.html" class="boton-enlace btn-taller">2. Taller de Investigación</a>
            <a href="electronica_basica.html" class="boton-enlace btn-electronica">3. Electrónica Básica</a>
            
            <hr class="separador">

            <a href="https://jarudev.github.io/itcts4z/" class="boton-enlace btn-principal">Ir a Página Principal (ITCTS4Z)</a>

            <div class="footer-texto">Amahia Gomez © 2026</div>
        </div>

        <div class="columna-fotos">
            <div class="caja-imagen">
                <img src="https://img2.rtve.es/im/6788662/?w=900" alt="Foto Colección">
            </div>
        </div>

    </div>

</body>
</html>
