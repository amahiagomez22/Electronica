<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio de Electricidad - Índice</title>
    <style>
        :root {
            --rosa: #ffb6c1;
            --rosa-oscuro: #ff69b4;
            --lila: #e0d1ff;
            --lila-oscuro: #6a4c93;
            --gris-suave: #f0f0f0;
            
            /* Verdes pastel mucho más claros */
            --verde-claro: #c8e6c9; 
            --verde-oscuro-texto: #2d5a27;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fdfbff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .contenedor-indice {
            background: white;
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 2px solid var(--lila);
        }

        h1 {
            color: var(--lila-oscuro);
            margin-bottom: 10px;
        }

        .menu-opciones {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
        }

        .opcion-card {
            text-decoration: none;
            padding: 18px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid transparent;
        }

        .opcion-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .btn-leyes {
            background-color: var(--rosa);
            color: white;
            border-color: var(--rosa-oscuro);
        }

        .btn-taller {
            background-color: var(--lila);
            color: var(--lila-oscuro);
            border-color: var(--lila-oscuro);
        }

        /* Botón 3 corregido con el verde súper pastel */
        .btn-electronica {
            background-color: var(--verde-claro);
            color: var(--verde-oscuro-texto);
            border-color: var(--verde-oscuro-texto);
        }

        .btn-externo {
            background-color: var(--gris-suave);
            color: #555;
            border-color: #ccc;
            margin-top: 10px;
            font-size: 0.9rem;
        }

        .btn-externo:hover {
            background-color: #e0e0e0;
        }

        footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #bbb;
        }
    </style>
</head>
<body>

    <div class="contenedor-indice">
        <h1>Mi Portafolio ♥</h1>
        <p>Explora las secciones de electricidad y electrónica:</p>

        <div class="menu-opciones">
            <a href="leyes_fundamentales.html" class="opcion-card btn-leyes">
                1. Leyes Fundamentales
            </a>

            <a href="taller_investigacion.html" class="opcion-card btn-taller">
                2. Taller de Investigación
            </a>

             <a href="electronica_basica.html" class="opcion-card btn-electronica">
                3. Electrónica Básica
            </a>

            <hr style="width: 80%; border: 0.5px solid #eee; margin: 10px auto;">

            <a href="https://jarudev.github.io/itcts4z/" class="opcion-card btn-externo">
                Ir a Página Principal (ITCTS4Z)
            </a>
        </div>

        <footer>
            Amahia Gomez &copy; 2026
        </footer>
    </div>

</body>
</html>
